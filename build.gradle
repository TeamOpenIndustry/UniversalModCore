plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
    id 'net.minecraftforge.renamer' version '1.1.2'
    id("com.gradleup.shadow") version "9.4.2"
}

configurations {
    shade
    implementation.extendsFrom shade
}

java {
    withSourcesJar()
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
}

String umcVersion = "1.3.0"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-${(providers.exec { commandLine("git", "rev-parse", "--verify", "--short=7", "HEAD") }.standardOutput.asText.get() as String).substring(0, 7)}"
    } catch (Exception ignored) {
        umcVersion += "-unknown"
    }
}
version = "1.12.2-forge-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
String archivesBaseName = "UniversalModCore"
base.archivesName = archivesBaseName

println("version: ${version}")

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
println("Java: ${providers.systemProperty("java.version").get()}, " +
        "JVM: ${providers.systemProperty("java.vm.version").get()} (${providers.systemProperty("java.vendor").get()}), " +
        "Arch: ${providers.systemProperty("os.arch").get()}")

renamer.enableMixinRefmaps {
    config "mixins.feat.universalmodcore.json"
    config "mixins.fix.universalmodcore.json"
}

minecraft {
    mappings channel: "stable", version: "39-1.12"

    setAccessTransformer("META-INF/UniversalModCore_at.cfg")

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            // Mixin requires either specifying the config via command line, or in the Manifest
            args "--mixin.config=mixins.feat.universalmodcore.json", "--mixin.config=mixins.fix.universalmodcore.json"

            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.export", "true"

            // Optional additional logging. The markers can be added/remove as needed, separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
            systemProperty "forge.logging.console.level", "debug"

            systemProperty "fml.coreMods.load", "cam72cam.mod.UMCMixinPlugin"
        }

        register("client")

        register("server") {
            args "--nogui"
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        url = 'https://maven.cleanroommc.com'
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:1.12.2-14.23.5.2847")
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // the 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // the deobf configurations:  'deobfCompile' and 'deobfProvided' are the same as the normal compile and provided,
    // except that these dependencies get remapped to your current MCP mappings
    //deobfCompile 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    //deobfProvided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
	shade renamer.dependency("curse.maven:invtweaks-223094:2482482")

    testImplementation('junit:junit:4.13.1')

    compileOnly('org.lwjgl.lwjgl:lwjgl_util:2.9.1')

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'

    implementation('zone.rong:mixinbooter:10.7') {
        transitive = false
    }
    annotationProcessor('zone.rong:mixinbooter:10.7') {
        transitive = false
    }

    runtimeOnly "net.minecrell:terminalconsoleappender:1.3.0"

    shade "at.yawk.lz4:lz4-java:1.10.2"
}

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes (
                'FMLAT': 'UniversalModCore_at.cfg',
                "FMLCorePlugin": "cam72cam.mod.UMCMixinPlugin",
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'TweakOrder': '0',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        )
    }
}

renamer.mappings.from minecraft.dependency.toSrgFile

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', "1.12.2"

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':"1.12.2"
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    duplicatesStrategy = DuplicatesStrategy.WARN
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
    // We need to use the generated mappings, which includes things generated by the annotation processor
    mappings renamer.mixin.generatedMappings
}

renamer.classes(tasks.named('shadowJar', Jar)) {
    archiveClassifier = ''
    // We need to use the generated mappings, which includes things generated by the annotation processor
    mappings renamer.mixin.generatedMappings
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'net.jpountz', "${project.group}.shade.net.jpountz"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()

    finalizedBy tasks.named('renameShadowJar')
}

assemble.dependsOn shadowJar

test {
    useJUnit()
    maxHeapSize = '1G'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact renameShadowJar
            artifact sourcesJar
            artifactId = archivesBaseName
        }
    }
    repositories {
        maven {
            url = "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

tasks.register('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo

// IntelliJ no longer downloads javadocs and sources by default, this tells Gradle to force IntelliJ to do it.
idea.module { downloadJavadoc = downloadSources = true }

eclipse {
    // Eclipse no longer downloads javadocs and sources by default, this tells Gradle to force Eclipse to do it.
    classpath { downloadJavadoc = downloadSources = true }

    // NOTE: ForgeGradle 7 does not yet support Eclipse run configurations
    // Run everytime eclipse builds the code
    //autoBuildTasks genEclipseRuns
    // Run when importing the project
    //synchronizationTasks 'genEclipseRuns'
}

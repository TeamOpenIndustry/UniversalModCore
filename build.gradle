buildscript {
    repositories {
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
    }
	dependencies {
        classpath 'net.neoforged.moddev.legacyforge:net.neoforged.moddev.legacyforge.gradle.plugin:2.0.140'
        classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.0"
    }
}

apply plugin: 'net.neoforged.moddev.legacyforge'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

configurations {
    shade
    implementation.extendsFrom shade
}

java {
    withSourcesJar()
}

repositories {
    maven {
        url "https://cursemaven.com"
    }
}

String umcVersion = "1.2.3"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-" + 'git rev-parse --verify --short=7 HEAD'.execute().text.trim()
    } catch (Exception ex) {
        umcVersion += "-unknown"
    }
}
version = "1.17.1-forge-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "UniversalModCore"

//java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

legacyForge {
    version = "1.17.1-37.1.1"

    accessTransformers.from "src/main/resources/META-INF/accesstransformer.cfg"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        universalmodcore {
            sourceSet sourceSets.main
        }
    }

    addModdingDependenciesTo(sourceSets.test)
}

repositories {
    mavenCentral()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"

    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // the 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // the deobf configurations:  'deobfCompile' and 'deobfProvided' are the same as the normal compile and provided,
    // except that these dependencies get remapped to your current MCP mappings
    //deobfCompile 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    //deobfProvided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')
    additionalRuntimeClasspath(annotationProcessor(shade('io.github.llamalad7:mixinextras-common:0.5.0')))

    testImplementation ('junit:junit:4.13')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    additionalRuntimeClasspath(shade group: 'javax.vecmath', name: 'vecmath', version: '1.5.2')
    additionalRuntimeClasspath(shade group: 'at.yawk.lz4', name: 'lz4-java', version: '1.10.2')
}

mixin {
    add sourceSets.main, 'mixins.universalmodcore.refmap.json'

    config 'mixins.feat.universalmodcore.json'
    config 'mixins.fix.universalmodcore.json'
}

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes([
            "Specification-Title": "universalmodcore",
            "Specification-Vendor": "",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": umcVersion,
            "Implementation-Vendor" :"",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.feat.universalmodcore.json,mixins.fix.universalmodcore.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'javax.vecmath', "${project.group}.shade.javax.vecmath"
    relocate 'com.llamalad7', "${project.group}.shade.com.llamalad7"
    relocate 'net.jpountz', "${project.group}.shade.net.jpountz"
    //Don't do this
//    relocate 'org.spongepowered', "${project.group}.shade.org.spongepowered"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

obfuscation {
    // Reobfuscate the shadowJar task, using the classpath of the main sourceset for properly remapping inherited members
    // This will place the original shadow jar in build/devlibs while putting this reobfuscated version in build/libs
    reobfuscate(tasks.named('shadowJar'), sourceSets.main)
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact shadowJar
            artifact sourcesJar
            artifactId archivesBaseName
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

task ('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo

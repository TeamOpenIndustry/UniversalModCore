buildscript {
    repositories {
        maven { url = "https://jcenter.bintray.com/" }
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url "https://plugins.gradle.org/" }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
        maven {
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.github.GTNewHorizons:ForgeGradle:1.2.11') {
            // This transitive dependency breaks plugins for some reason. Only GTNH-FG has this issue.
            exclude group: "org.eclipse.equinox"
        }
    }
}

apply plugin: 'forge'

configurations {
    shade
    compile.extendsFrom shade
}

apply plugin: 'maven-publish'

repositories {
    maven {
        url "https://cursemaven.com"
    }
}

String umcVersion = "1.2.3"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-" + 'git rev-parse --verify --short=7 HEAD'.execute().text.trim()
    } catch (Exception ex) {
        umcVersion += "-unknown"
    }
}
version = "1.7.10-forge-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "UniversalModCore"

sourceCompatibility = targetCompatibility = 1.8
apply plugin: 'java'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"

//    coreMod = 'cam72cam.mod.UMCMixinPlugin'
//    clientRunArgs.addAll('--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker', '--mixin', 'mixins.universalmodcore.json')
//    serverRunArgs.addAll('--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker', '--mixin', 'mixins.universalmodcore.json')
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "stable_12"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
    maven {
        name = "aikar"
        url = "https://repo.aikar.co/content/groups/aikar/"
    }
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // the 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // the deobf configurations:  'deobfCompile' and 'deobfProvided' are the same as the normal compile and provided,
    // except that these dependencies get remapped to your current MCP mappings
    //deobfCompile 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    //deobfProvided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
	shade "curse.maven:invtweaks-223094:2431302"
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT'){
        setTransitive false
        exclude group: 'org.apache.logging.log4j'
    }

//    shade('io.github.llamalad7:mixinextras-common:0.5.0')
    testCompile('junit:junit:4.13.1')

//    runtime "net.minecrell:terminalconsoleappender:1.3.0"
//    runtime group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.0.2'

    shade group: 'at.yawk.lz4', name: 'lz4-java', version: '1.10.2'
}

def tempDir = System.getenv("RUNNER_TEMP") == null ? tasks.compileJava.temporaryDir : System.getenv("RUNNER_TEMP")

ext.outRefMapFile = "${tempDir}/mixins.universalmodcore.refmap.json"

def outSrgFile = "${tempDir}/outSrg.srg"

afterEvaluate {
    tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];
}

reobf {
    addExtraSrgFile outSrgFile
}

jar {
    classifier = ''
    manifest {
        attributes (
                'FMLCorePlugin': 'cam72cam.mod.UMCMixinPlugin',
                'FMLAT': 'UniversalModCore_at.cfg',
                'FMLCorePluginContainsFMLMod': true,
                "ForceLoadAsMod": true,
                'TweakOrder': '0',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        )
    }

    from {
        configurations.shade.collect {
            zipTree(it)
        }
    }
    from outRefMapFile;
}

jar.finalizedBy('reobf')

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

test {
    useJUnit()
    maxHeapSize = '1G'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifactId archivesBaseName
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

task ('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo

buildscript {
    repositories {
        maven {
            // RetroFuturaGradle
            name = "GTNH Maven"
            url = uri("https://nexus.gtnewhorizons.com/repository/public/")
            mavenContent {
                includeGroupByRegex("com\\.gtnewhorizons\\..+")
                includeGroup("com.gtnewhorizons")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven {
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.gtnewhorizons:retrofuturagradle:1.4.0')
        classpath('com.github.johnrengelman.shadow:com.github.johnrengelman.shadow.gradle.plugin:2.0.4')
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

apply plugin: 'com.gtnewhorizons.retrofuturagradle'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

repositories {
    maven {
        url "https://cursemaven.com"
    }
}

String umcVersion = "1.2.3"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-" + 'git rev-parse --verify --short=7 HEAD'.execute().text.trim()
    } catch (Exception ex) {
        umcVersion += "-unknown"
    }
}
version = "1.7.10-forge-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "UniversalModCore"

apply plugin: 'java'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    // Generate sources jar when building and publishing
    withSourcesJar()
}

// Most RFG configuration lives here, see the JavaDoc for com.gtnewhorizons.retrofuturagradle.MinecraftExtension
minecraft {
    mcVersion.set("1.7.10")
    username.set("Developer")
    useForgeEmbeddedMappings = false
    extraTweakClasses.add("org.spongepowered.asm.launch.MixinTweaker")

    injectedTags.put("VERSION", project.version)

    extraRunJvmArguments.add("-ea:${project.group}")

    groupsToExcludeFromAutoReobfMapping.addAll("com.diffplug", "com.diffplug.durian", "net.industrial-craft")
}

tasks.deobfuscateMergedJarToSrg.configure {accessTransformerFiles.from("src/main/resources/META-INF/UniversalModCore_at.cfg")}

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
    maven {
        name = "aikar"
        url = "https://repo.aikar.co/content/groups/aikar/"
    }
    maven {
        url = "https://jitpack.io"
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    shade "curse.maven:invtweaks-223094:2431302"

    def unimixinsVersion = "0.1.14"

    modUtils.enableMixins(implementation(annotationProcessor("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")), 'mixins.universalmodcore.refmap.json')

    implementation(':DragonBlockC-v1.4.85:')
    implementation(':JBRA-Client-v1.6.52:')
    implementation(':JRMCore-v1.3.51:')
    implementation('junit:junit:4.13.1')

    shade group: 'at.yawk.lz4', name: 'lz4-java', version: '1.10.2'
}

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes (
                'FMLCorePlugin': 'cam72cam.mod.UMCMixinPlugin',
                'FMLAT': 'UniversalModCore_at.cfg',
                'FMLCorePluginContainsFMLMod': true,
                "ForceLoadAsMod": true,
                'TweakOrder': '0',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        )
    }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'net.jpountz', "${project.group}.shade.net.jpountz"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
}

assemble.dependsOn shadowJar

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

test {
    useJUnit()
    maxHeapSize = '1G'
}

tasks.named('reobfJar').configure {
    inputJar.set(tasks.named('shadowJar').flatMap({ it.archiveFile }))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact reobfJar
            artifact sourcesJar
            artifactId archivesBaseName
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

tasks.register('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo
//BUILDSCRIPT//
plugins {
    id 'java'
    id 'eclipse'
    //A customized fork for better support on Cleanroom
    id 'xyz.wagyourtail.unimined' version "1.4.18-kappa"
    id 'com.gradleup.shadow' version "9.4.1"
    id "maven-publish"
    id 'xyz.wagyourtail.jvmdowngrader' version '2.0.1'
}
configurations {
    umcShade
    modImplementation.extendsFrom umcShade
}

//PLUGINS//

//MINECRAFT//
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jvmdg {
    quiet = false
    downgradeTo = JavaVersion.VERSION_17
    //Will introduce some untraceable bugs, investigate later
    //multiReleaseOriginal = true
    shadeInlining = false
    dg(configurations.umcShade, false)
}

unimined.minecraft {
    version "1.18.2"

    mappings {
        intermediary()
        mojmap()
        parchment("1.18.2", "2022.11.06")
    }

    mods {
        modImplementation {
            //In case something uses named mapping in AW
            catchAWNamespaceAssertion()
        }
    }

    minecraftForge {
        loader("40.3.12")
    }

    // Support for running in dev environment
    def downgrade = tasks.register("downgrade", xyz.wagyourtail.jvmdg.gradle.task.files.DowngradeFiles) {
        inputCollection = sourceSet.output.classesDirs + sourceSet.runtimeClasspath
        classpath = project.files()
        outputCollection.files
    }

    runs.config("client") {
        classpath = downgrade.get().outputCollection + files(jvmdg.getDowngradedApi(JavaVersion.VERSION_17))
        var downgradedSrc = project.getLayout().getBuildDirectory().dir("tmp/downgrade/main").get().asFile.toString()
        environment["MOD_CLASSES"] = "${downgradedSrc};${downgradedSrc}"
    }

    runs.config("server") {
        classpath = downgrade.get().outputCollection + files(jvmdg.getDowngradedApi(JavaVersion.VERSION_17))
        var downgradedSrc = project.getLayout().getBuildDirectory().dir("tmp/downgrade/main").get().asFile.toString()
        environment["MOD_CLASSES"] = "${downgradedSrc};${downgradedSrc}"
    }

    defaultRemapJar = true
}

//DEPENDENCIES//
#UMC_REPO#

dependencies {
    implementation group: 'javax.vecmath', name: 'vecmath', version: '1.5.2'
    modImplementation #UMC_DEPENDENCY#
}

//JAR//
jar {
    enabled = false
}

shadowJar {
    configurations = [project.configurations.umcShade]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    archiveClassifier = 'shadow'
}

remapJar {
    inputFile = tasks.shadeDowngradedApi.archiveFile
    dependsOn(tasks.named("shadowJar"))
    archiveClassifier = ''
}

tasks.named("assemble") {
    dependsOn(tasks.named("remapJar"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", "#MINECRAFT#"
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':"#MINECRAFT#"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

//BUILDSCRIPT//
buildscript {
    repositories {
        maven {
            name "neoforgedReleases"
            url "https://maven.neoforged.net/releases"
        }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
    }
	dependencies {
        classpath group: 'net.neoforged.gradle', name: 'userdev', version: '7.1.11'
        classpath group: 'net.neoforged.gradle', name: 'common', version: '7.1.11'
	}
}

//PLUGINS//
apply plugin: 'net.neoforged.gradle.userdev'
apply plugin: 'net.neoforged.gradle.common'
apply plugin: 'eclipse'

//MINECRAFT//
sourceSets {
    main {
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources"
            ]
        }
    }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', '#ID#'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', '#ID#'
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', '#ID#'
    }

    data {arguments.addAll '--mod', '#ID#', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

//DEPENDENCIES//
#UMC_REPO#

dependencies {
    implementation "net.neoforged:neoforge:20.4.251"
    implementation group: 'javax.vecmath', name: 'vecmath', version: '1.5.2'
    implementation #UMC_DEPENDENCY#
}

//JAR//
jar {
    manifest {
        attributes([
                "Specification-Title": "#ID#",
                "Specification-Vendor": "#ID#",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"#ID#",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
